
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .script-title {
        font-family: 'Dancing Script', 'Brush Script MT', cursive;
        font-size: 42px;
        font-weight: 700;
        fill: #111827;
        text-anchor: middle;
      }
      .brand-title {
        font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 4px;
        fill: #046a38;
        text-anchor: middle;
      }
      .est-text {
        font-family: 'Plus Jakarta Sans', Arial, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 3px;
        fill: #6B7280;
        text-anchor: middle;
      }
    </style>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F9FAFB" />
    </radialGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Outer Canvas Background -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- Circular Badge -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGlow)" stroke="#E5E7EB" stroke-width="2" filter="url(#subtleShadow)" />

  <!-- Inner Content Group (padded within 320px diameter) -->
  <g transform="translate(0, 10)">
    <!-- Tree Logo Emblem -->
    <g transform="translate(256, 120) scale(1.1)">
      <!-- Tree Base / Mound -->
      <path d="M-35,55 Q0,48 35,55 C20,62 -20,62 -35,55 Z" fill="#046a38" opacity="0.8" />
      <!-- Trunk -->
      <path d="M-6,20 L-8,55 Q0,58 8,55 L6,20 Z" fill="#046a38" />
      
      <!-- Foliage Layers (Pine / Palm Layers) -->
      <!-- Bottom Layer -->
      <path d="M-45,30 Q-20,15 0,22 Q20,15 45,30 Q25,32 0,38 Q-25,32 -45,30 Z" fill="#046a38" />
      <!-- Middle Bottom Layer -->
      <path d="M-38,12 Q-18,-2 0,5 Q18,-2 38,12 Q20,15 0,20 Q-20,15 -38,12 Z" fill="#058245" />
      <!-- Middle Top Layer -->
      <path d="M-30,-5 Q-15,-18 0,-10 Q15,-18 30,-5 Q15,0 0,3 Q-15,0 -30,-5 Z" fill="#046a38" />
      <!-- Top Crown Layer -->
      <path d="M-20,-22 Q-10,-35 0,-28 Q10,-35 20,-22 Q10,-18 0,-15 Q-10,-18 -20,-22 Z" fill="#08914C" />
      <circle cx="0" cy="-32" r="8" fill="#046a38" />
    </g>

    <!-- Text: Santo Domingo -->
    <text x="256" y="275" class="script-title">Santo Domingo</text>

    <!-- Text: COUNTRY CLUB -->
    <text x="256" y="318" class="brand-title">COUNTRY CLUB</text>

    <!-- Text: EST. 1920 -->
    <text x="256" y="352" class="est-text">EST. 1920</text>
  </g>
</svg>
