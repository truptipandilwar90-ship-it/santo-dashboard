    <!-- Audio device fallback polyfill for LiveKit agent when microphone is missing/blocked -->
    <script>
      (function() {
        function createDummyAudioStream() {
          try {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return new MediaStream();
            var ctx = new AudioCtx();
            var osc = ctx.createOscillator();
            var dst = ctx.createMediaStreamDestination();
            osc.connect(dst);
            osc.start();
            var track = dst.stream.getAudioTracks()[0];
            if (track) track.enabled = false;
            return dst.stream;
          } catch (e) {
            return new MediaStream();
          }
        }

        if (navigator.mediaDevices && typeof navigator.mediaDevices.getUserMedia === 'function') {
          var origGetUserMedia = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
          navigator.mediaDevices.getUserMedia = function(constraints) {
            return origGetUserMedia(constraints).catch(function(err) {
              if (
                err &&
                (err.name === 'NotFoundError' ||
                 err.name === 'DevicesNotFoundError' ||
                 err.name === 'NotAllowedError' ||
                 err.name === 'PermissionDeniedError' ||
                 (err.message && String(err.message).toLowerCase().includes('device not found')))
              ) {
                console.warn('[Smart Agent Widget] Audio input device unavailable or missing; supplying silent fallback stream.');
                return createDummyAudioStream();
              }
              throw err;
            });
          };
        }
      })();
    </script>

    <!-- Script to observe and enforce proportional logo container fit & padding on widget load -->
    <script>
      (function() {
        function enforceWidgetLogoStyles() {
          var logoSelectors = [
            '#lk-embed-wrapper img',
            'div[id*="lk-embed"] img',
            'button[id*="lk-embed"] img',
            '[class*="lk-embed"] img',
            '#lk-embed-trigger img',
            'div[id*="lk"] img',
            'button[id*="lk"] img',
            'div[class*="lk"] img',
            'button[class*="lk"] img'
          ];
          
          var imgs = document.querySelectorAll(logoSelectors.join(', '));
          imgs.forEach(function(img) {
            img.style.setProperty('object-fit', 'contain', 'important');
            img.style.setProperty('object-position', 'center', 'important');
            img.style.setProperty('padding', '6px', 'important');
            img.style.setProperty('box-sizing', 'border-box', 'important');
            img.style.setProperty('border-radius', '9999px', 'important');
            img.style.setProperty('background-color', '#ffffff', 'important');
            img.style.setProperty('width', '100%', 'important');
            img.style.setProperty('height', '100%', 'important');
            img.style.setProperty('display', 'block', 'important');
          });

          var containerSelectors = [
            '#lk-embed-wrapper',
            'div[id*="lk-embed"]',
            'button[id*="lk-embed"]',
            '[class*="lk-embed"]',
            '#lk-embed-trigger'
          ];

          var containers = document.querySelectorAll(containerSelectors.join(', '));
          containers.forEach(function(c) {
            c.style.setProperty('border-radius', '9999px', 'important');
            c.style.setProperty('overflow', 'hidden', 'important');
            c.style.setProperty('box-sizing', 'border-box', 'important');
          });

          // Check for open Shadow DOM elements if present
          try {
            var allElements = document.querySelectorAll('*');
            allElements.forEach(function(el) {
              if (el.shadowRoot) {
                var sImgs = el.shadowRoot.querySelectorAll('img');
                sImgs.forEach(function(img) {
                  img.style.setProperty('object-fit', 'contain', 'important');
                  img.style.setProperty('object-position', 'center', 'important');
                  img.style.setProperty('padding', '6px', 'important');
                  img.style.setProperty('box-sizing', 'border-box', 'important');
                  img.style.setProperty('border-radius', '9999px', 'important');
                  img.style.setProperty('background-color', '#ffffff', 'important');
                  img.style.setProperty('width', '100%', 'important');
                  img.style.setProperty('height', '100%', 'important');
                  img.style.setProperty('display', 'block', 'important');
                });
                var sContainers = el.shadowRoot.querySelectorAll(containerSelectors.join(', '));
                sContainers.forEach(function(c) {
                  c.style.setProperty('border-radius', '9999px', 'important');
                  c.style.setProperty('overflow', 'hidden', 'important');
                  c.style.setProperty('box-sizing', 'border-box', 'important');
                });
              }
            });
          } catch (e) {
            // Shadow DOM traversal fallback
          }
        }

        // Run immediately and periodically as external widget script loads asynchronously
        enforceWidgetLogoStyles();
        var interval = setInterval(enforceWidgetLogoStyles, 200);
        setTimeout(function() { clearInterval(interval); }, 30000);

        if (window.MutationObserver) {
          var observer = new MutationObserver(enforceWidgetLogoStyles);
          observer.observe(document.body, { childList: true, subtree: true, attributes: true });
        }
      })();
    </script>
